name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Logik-Tests (reines Java)
        run: |
          mkdir -p build/logic
          javac -d build/logic \
            app/src/main/java/de/anasjabaly/fokus/Matcher.java \
            app/src/main/java/de/anasjabaly/fokus/UrlCheck.java \
            tests/LogicTest.java
          java -cp build/logic LogicTest

      - name: Signaturschlüssel vorhanden?
        env:
          FOKUS_KEYSTORE_B64: ${{ secrets.FOKUS_KEYSTORE_B64 }}
        run: |
          if [ -z "$FOKUS_KEYSTORE_B64" ]; then
            echo "::error::Secret FOKUS_KEYSTORE_B64 fehlt. Ohne festen Schlüssel lässt sich die APK nicht als Update installieren."
            exit 1
          fi

      - name: Debug-APK bauen
        env:
          FOKUS_KEYSTORE_B64: ${{ secrets.FOKUS_KEYSTORE_B64 }}
          FOKUS_KEYSTORE_PASSWORD: ${{ secrets.FOKUS_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fokus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
